# Values retired from pyproject.toml. update-devenv drops each value listed
# here from the array at the same key path in a project's pyproject.toml.

[dependency-groups]
dev = [
  # devenv's scripts declare these themselves (PEP 723); no copied script
  # imports them.
  "semver~=3.1.0",
  "tomlkit~=0.14",
]

[tool.complexipy]
exclude = [
  # complexipy matches these globs against each file's whole path, relative
  # to each root in paths. A dir name such as "node_modules" or
  # "**/__pycache__" never matches a file, and "vulture_ignorelist.py"
  # matched <root>/vulture_ignorelist.py, not the one at the project root.
  # Discovery already skips hidden and gitignored paths, which covers what
  # "**/.*" and "*/.*" were after.
  "**/.*",
  "*/.*",
  ".cache",
  ".git",
  ".github",
  ".venv",
  "**/__pycache__",
  "frontend",
  "node_modules",
  "site",
  "test-results",
  "typings",
  "vulture_ignorelist.py",
]

[tool.uv.build-backend]
source-include = [
  # CircleCI is no longer used (and this entry was misspelled anyway).
  ".circlci/**",
  # remark is no longer used; the ".*ignore" glob covered it anyway.
  ".remarkignore",
  # No project has a ci/ dir.
  "ci/**",
  # Misspelled; "mkdocs.yml" is the real file.
  "mkdocks.yml",
]

[tool.vulture]
exclude = [
  # vulture fnmatches absolute paths, so these matched only the dir itself,
  # never a file under it.
  "**/__pycache__",
  "**/node_modules",
  # These also matched a hidden dir above the project root, so they excluded
  # every file of a .claude/worktrees/ checkout. Replaced by "*/.venv/*".
  "**/.*",
  "*/.*",
  # Replaced by "*/node_modules/*".
  "*/__pycache__*",
  "*/node_modules*",
  # vulture reads only .py files, and __pycache__ holds only .pyc files.
  "*/__pycache__/*",
  # Wrapped as "*dist/*", "*site*" and so on, these also matched a dir above
  # the project root, or any name containing them, such as composite.py.
  # Replaced by "*/dist/*" and the like.
  "dist/",
  "frontend/",
  "site",
  "test-results/",
  "typings/",
  # Misspelled; the real dir is test-results/.
  "test_results/",
]

[tool.codespell]
# codespell skips hidden files and dirs itself, but never the "." it walks from.
# The ".*" skip below undid this setting anyway.
check-hidden = true
skip = [
  # codespell fnmatches the dirs it walks, and this matches the first one, ".",
  # so it skipped the whole tree.
  ".*",
  # Matches every other dir it walks, like "./pkg".
  ".*/*",
  # codespell walks from ".", so "./name" skips the name at the root only. The
  # bare name the template ships skips it at any depth.
  "./bun.lock",
  "./dist",
  "./node_modules",
  "./package.json",
  "./test-results",
  "./uv.lock",
  # Every path codespell walks starts with ".", so this matched nothing.
  "/uv.lock",
]

[tool.basedpyright]
# basedpyright excludes these itself, on top of any exclude list.
exclude = ["**/.*", "**/__pycache__", "**/node_modules"]

[tool.coverage.run]
omit = [
  # coverage's "*" stops at "/", so this matched hidden files but no file
  # under a hidden dir. coverage skips virtualenvs itself.
  "*/.*",
  # A pattern without "/" matches only a file name, and no source file has
  # this in its name.
  "*__pycache__*",
]

[tool.radon]
exclude = [
  # radon skips hidden dirs and files itself.
  ".*",
  ".*/*",
  # radon reads .py files and python scripts, and __pycache__ holds neither.
  "__pycache__/*",
]

[tool.ruff]
extend-exclude = [
  # One of ruff's default excludes, which extend-exclude adds to.
  "dist",
  # ruff reads no file that __pycache__ holds.
  "**/__pycache__",
]

[tool.ty.src]
exclude = [
  # Covered by ty's default excludes, which apply on top of this list.
  "**/node_modules",
  "dist",
  # ty reads no file that __pycache__ holds.
  "**/__pycache__",
]
