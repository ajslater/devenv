# Values retired from pyproject.toml. update-devenv drops each value listed
# here from the array at the same key path in a project's pyproject.toml.

[tool.uv.build-backend]
source-include = [
  # CircleCI is no longer used (and this entry was misspelled anyway).
  ".circlci/**",
  # remark is no longer used; the ".*ignore" glob covered it anyway.
  ".remarkignore",
]

[tool.vulture]
exclude = [
  # vulture fnmatches absolute paths, so these matched only the dir itself,
  # never a file under it.
  "**/__pycache__",
  "**/node_modules",
  # Same as "*/.*", which replaces it.
  "**/.*",
  # Replaced by "*/__pycache__/*" and "*/node_modules/*".
  "*/__pycache__*",
  "*/node_modules*",
  # Misspelled; the real dir is test-results/.
  "test_results/",
]

[tool.codespell]
# codespell skips hidden files and dirs itself, but never the "." it walks from.
# The ".*" skip below undid this setting anyway.
check-hidden = true
skip = [
  # codespell fnmatches the dirs it walks, and this matches the first one, ".",
  # so it skipped the whole tree.
  ".*",
  # Matches every other dir it walks, like "./pkg".
  ".*/*",
]
