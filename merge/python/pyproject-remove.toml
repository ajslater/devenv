# Values retired from pyproject.toml. update-devenv drops each value listed
# here from the array at the same key path in a project's pyproject.toml.

[tool.complexipy]
exclude = [
  # complexipy matches these globs against each file's whole path, relative
  # to each root in paths. A dir name such as "node_modules" or
  # "**/__pycache__" never matches a file, and "vulture_ignorelist.py"
  # matched <root>/vulture_ignorelist.py, not the one at the project root.
  # Discovery already skips hidden and gitignored paths, which covers what
  # "**/.*" and "*/.*" were after.
  "**/.*",
  "*/.*",
  ".cache",
  ".git",
  ".github",
  ".venv",
  "**/__pycache__",
  "frontend",
  "node_modules",
  "site",
  "test-results",
  "typings",
  "vulture_ignorelist.py",
]

[tool.uv.build-backend]
source-include = [
  # CircleCI is no longer used (and this entry was misspelled anyway).
  ".circlci/**",
  # remark is no longer used; the ".*ignore" glob covered it anyway.
  ".remarkignore",
]

[tool.vulture]
exclude = [
  # vulture fnmatches absolute paths, so these matched only the dir itself,
  # never a file under it.
  "**/__pycache__",
  "**/node_modules",
  # These also matched a hidden dir above the project root, so they excluded
  # every file of a .claude/worktrees/ checkout. Replaced by "*/.venv/*".
  "**/.*",
  "*/.*",
  # Replaced by "*/__pycache__/*" and "*/node_modules/*".
  "*/__pycache__*",
  "*/node_modules*",
  # Wrapped as "*dist/*", "*site*" and so on, these also matched a dir above
  # the project root, or any name containing them, such as composite.py.
  # Replaced by "*/dist/*" and the like.
  "dist/",
  "frontend/",
  "site",
  "test-results/",
  "typings/",
  # Misspelled; the real dir is test-results/.
  "test_results/",
]

[tool.codespell]
# codespell skips hidden files and dirs itself, but never the "." it walks from.
# The ".*" skip below undid this setting anyway.
check-hidden = true
skip = [
  # codespell fnmatches the dirs it walks, and this matches the first one, ".",
  # so it skipped the whole tree.
  ".*",
  # Matches every other dir it walks, like "./pkg".
  ".*/*",
]
