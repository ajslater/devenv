# Values retired from .readthedocs.yaml. update-devenv drops each list value
# here from the list at the same key path in a project's .readthedocs.yaml. A
# scalar here gives way to the template's current value when the project
# still holds it.

build:
  # Replaced by ubuntu-lts-latest, Read the Docs' name for the newest LTS.
  os: ubuntu-24.04

# Zensical has no Read the Docs builder; build.jobs runs it instead.
mkdocs:
  configuration: mkdocs.yml

# The docs group in pyproject.toml is installed with uv instead.
python:
  install:
    - requirements: docs/requirements.txt
