# A wpls-shaped caller: a macOS-only project runs the check matrix natively.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/devenv-check.yml
    with:
      container: false
      runner: macos-latest
    permissions:
      contents: read
      actions: read
      packages: write
      checks: write

  pypi:
    name: Publish to PyPI
    needs: ci
    if: ${{ !cancelled() && needs.ci.result == 'success' && needs.ci.outputs.deploy == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions

      - name: Publish to PyPI
        uses: ./.github/actions/devenv-pypi
        with:
          token: ${{ secrets.PYPI_TOKEN }}

  release:
    name: Release
    needs: [ci, pypi]
    if: ${{ !cancelled() && needs.ci.outputs.release == 'true' && needs.pypi.result == 'success' }}
    uses: ./.github/workflows/devenv-release.yml
    permissions:
      contents: write
