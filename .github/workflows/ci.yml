# devenv's own CI: lint, test, and check that updating the repo from its own
# sources changes nothing. Not a devenv feature, so no child repo gets it.
name: CI

on:
  push:
    branches: [main]
  pull_request: {}

# A newer push cancels a pull request's run; every main push gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, Test & Dogfood
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install
        run: |
          uv sync --locked --all-groups
          bun install --frozen-lockfile

      # The ci feature's action, from its source: devenv has no ci feature, so
      # no copy lands in .github/actions. make lint, make update-devenv and the
      # tests run each tool from PATH; devenv has no docker feature.
      - name: Install lint tools
        uses: ./copy/ci/.github/actions/devenv-lint-tools
        with:
          tools: shellcheck shellharden shfmt actionlint

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # The root's bin/, cfg/ and merged configs are update-devenv's output
      # from this repo's own sources, so a stale one shows up as a diff.
      # --intent-to-add makes a newly copied file part of the diff too.
      - name: Dogfood drift
        run: |
          make update-devenv UPDATE_DEVENV_FLAGS=--no-update-deps
          git add --all --intent-to-add
          git diff --exit-code
