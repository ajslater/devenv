# devenv's own CI: lint, test, and check that updating the repo from its own
# sources changes nothing. Not a devenv feature, so no child repo gets it.
name: CI

on:
  push:
    branches: [main]
  pull_request: {}

# A newer push cancels a pull request's run; every main push gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, Test & Dogfood
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install
        run: |
          uv sync --locked --all-groups
          bun install --frozen-lockfile

      # Release binaries, pinned by version and sha256. make lint, make
      # update-devenv and the tests run each one from PATH.
      - name: Install shell tools
        run: |
          bin="$RUNNER_TEMP/shell-tools"
          mkdir -p "$bin"
          while read -r name sha256 url; do
            file="$RUNNER_TEMP/${url##*/}"
            curl --fail --silent --show-error --location --retry 3 --output "$file" "$url"
            echo "$sha256  $file" | sha256sum -c -
            if [[ $file == *.tar.gz ]]; then
              mkdir "$file.d"
              tar -xzf "$file" -C "$file.d"
              file=$(find "$file.d" -type f -name "$name")
            fi
            install "$file" "$bin/$name"
            "$bin/$name" --version
          done <<'EOF'
          shellcheck b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          shfmt 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          shellharden e81e97bc6bccff59b826d3b39328ab19b26721a236440f740ba71754531c7286 https://github.com/anordal/shellharden/releases/download/v4.3.2/shellharden-x86_64-unknown-linux-gnu.tar.gz
          actionlint 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          EOF
          echo "$bin" >>"$GITHUB_PATH"

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # The root's bin/, cfg/ and merged configs are update-devenv's output
      # from this repo's own sources, so a stale one shows up as a diff.
      # --intent-to-add makes a newly copied file part of the diff too.
      - name: Dogfood drift
        run: |
          make update-devenv UPDATE_DEVENV_FLAGS=--no-update-deps
          git add --all --intent-to-add
          git diff --exit-code
